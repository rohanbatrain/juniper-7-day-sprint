# The day-06 fabric, reached over the lab management network from the lab host.
all:
  vars:
    ansible_connection: ansible.netcommon.netconf
    ansible_network_os: junipernetworks.junos.junos
    ansible_user: "{{ lookup('env', 'LAB_USER') | default('admin', true) }}"
    ansible_password: "{{ lookup('env', 'LAB_PASSWORD') | default('admin@123', true) }}"
    ansible_host_key_checking: false
  children:
    spines:
      hosts:
        spine1: { ansible_host: 10.99.0.31 }
        spine2: { ansible_host: 10.99.0.32 }
    leaves:
      hosts:
        leaf1: { ansible_host: 10.99.0.41 }
        leaf2: { ansible_host: 10.99.0.42 }
